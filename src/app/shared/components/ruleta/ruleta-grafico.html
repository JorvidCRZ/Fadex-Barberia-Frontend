<div class="ruleta-wrap rounded-xl">
    @if (reproducirMusica) {
    <app-ruleta-audio />
    }

    <div class="marquesina" [class.marquesina--girando]="girando()">
        <div class="puntero" aria-hidden="true">
            <svg viewBox="0 0 40 58" width="40" height="58">
                <path d="M20 52 C10 38 2 28 2 16 A18 18 0 0 1 38 16 C38 28 30 38 20 52 Z" fill="url(#gradPuntero)" stroke="#3a2a10" stroke-width="1.5" />
                <circle cx="20" cy="17" r="7" fill="#151312" />
                <defs>
                    <linearGradient id="gradPuntero" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#f4dd9a" />
                        <stop offset="100%" stop-color="#c8952f" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="anillo-luces" aria-hidden="true">
            @for (i of bulbos; track i) {
            <span class="bulbo" [style.transform]="'rotate(' + (i * 15) + 'deg) translateY(-158px)'" [style.animation-delay.ms]="(i % 2 === 0 ? 0 : 260)"></span>
            }
        </div>

        <div class="disco" [style.transform]="'rotate(' + rotacionActual() + 'deg)'">
            <svg class="disco-svg" viewBox="0 0 300 300">
                @for (p of premios; track p.id; let i = $index) {
                <path [attr.d]="sectorPath(i)" [attr.fill]="p.color || (i % 2 === 0 ? '#f4efe1' : '#171412')"></path>
                }
                <circle cx="150" cy="150" r="149" fill="none" stroke="#caa24a" stroke-width="2" opacity="0.5" />
            </svg>

            @for (p of premios; track p.id; let i = $index) {
            <div class="ruleta-etiqueta" [style.transform]="'rotate(' + anguloCentroSegmento(i) + 'deg)'">
                <div class="ruleta-etiqueta__contenido"
                    [style.transform]="'translateY(-72px) rotate(-' + anguloCentroSegmento(i) + 'deg)'"
                    [class.ruleta-etiqueta__contenido--claro]="p.color ? false : i % 2 === 0"
                    [class.ruleta-etiqueta__contenido--oscuro]="p.color ? false : i % 2 !== 0"
                    [style.color]="p.color ? obtenerColorTexto(p.color) : null">
                    <span class="iconos"><i class="pi" [ngClass]="obtenerIcono(p.tipoPremio)"></i></span>
                    <span class="ruleta-etiqueta__texto">{{ p.label }} @if (p.sublabel) { <small>{{ p.sublabel }}</small> }</span>
                </div>
            </div>
            }

            <div class="disco-centro">
                <span>GIRA</span>
            </div>
        </div>
    </div>

    @if (interactiva) {
    <app-button variant="primary" [label]="textoBoton" loadingLabel="Girando…" [loading]="girando()"
        [disabled]="!premios.length" (clicked)="onClickGirar()" />
    } @else {
    <p class="etiqueta-solo-vista">Vista previa (no interactiva)</p>
    }

    <app-premio-ganado
        [visible]="mostrarResultado()"
        (visibleChange)="mostrarResultado.set($event)"
        [titulo]="premioGanador()?.label ?? ''"
        [descripcion]="premioGanador()?.descripcion"
        [icono]="'pi ' + obtenerIcono(premioGanador()?.tipoPremio)"
        [imagen]="premioGanador()?.imagen"
        [codigo]="codigoGanador"
        [sinPremio]="premioGanador()?.tipoPremio === TipoPremio.SIN_PREMIO" />
</div>
