<div class="flex flex-col items-center gap-3">
    <p class="m-0 text-sm font-medium text-brand-gold">{{ ruletaNombre }}</p>

    @if (cargando) {
    <app-empty-state tipo="cargando" mensaje="Cargando ruleta..." />
    } @else if (error) {
    <app-empty-state tipo="error" [mensaje]="error" />
    } @else if (!segmentos.length) {
    <app-empty-state icono="star" mensaje="Esta ruleta aún no tiene premios configurados." />
    } @else {
    <app-ruleta-grafico [premios]="segmentos" [interactiva]="interactiva" [reproducirMusica]="musicaActiva" [textoBoton]="textoBoton" [modoServidor]="true" (girarSolicitado)="onGirarSolicitado()" />
    }
</div>
