<div class="mt-5 flex flex-col gap-6">
    <app-page-header titulo="Fidelización" icono="star" subtitulo="Tus tarjetas, giros y premios" />

    <div class="overflow-hidden rounded-2xl border border-white/[0.06] bg-ui-card shadow-lg shadow-black/20">
        <p-tabs [(value)]="activeTab" (valueChange)="onTabChange($event)">
            <p-tablist class="flex flex-wrap gap-3 border-b border-white/[0.06] bg-ui-surface px-3 py-3 md:px-4">
                @for (tab of tabs; track tab.value) {
                <p-tab [value]="tab.value" class="flex items-center gap-2 text-inherit">
                    <div class="flex items-center gap-2 rounded-xl px-4 py-3 transition-colors"
                        [ngClass]="activeTab === tab.value
                            ? 'border border-b-2 border-brand-gold/30 bg-brand-gold/10 text-brand-gold shadow-sm'
                            : 'text-text-secondary hover:bg-ui-elevated'">
                        <i [class]="tab.icon"></i>
                        <span>{{ tab.label }}</span>
                    </div>
                </p-tab>
                }
            </p-tablist>

            <p-tabpanels class="overflow-hidden bg-ui-card p-4 md:p-6">
                <p-tabpanel value="resumen"><app-mi-resumen /></p-tabpanel>
                <p-tabpanel value="mis-tarjetas"><app-mis-tarjetas /></p-tabpanel>
                <p-tabpanel value="mi-historial"><app-mi-historial /></p-tabpanel>
                <p-tabpanel value="mis-premios"><app-mis-premios /></p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </div>
</div>
