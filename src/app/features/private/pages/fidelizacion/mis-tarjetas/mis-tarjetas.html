<div class="w-full">

    <header class="mb-6">
        <h2 class="m-0 text-xl font-bold text-text-primary">Tus tarjetas de fidelización</h2>
        <p class="mt-1 text-sm text-text-secondary">Programa de puntos: completa tu progreso y gira la ruleta</p>
    </header>

    @if (cargando) {
    <app-empty-state tipo="cargando" mensaje="Cargando tarjetas..." />
    } @else if (error) {
    <app-empty-state tipo="error" [mensaje]="error">
        <app-button variant="secondary" size="sm" icon="refresh" label="Reintentar" (clicked)="cargarMisTarjetas()" />
    </app-empty-state>
    } @else {
    <app-tarjeta-grafico variante="cliente" [tarjetas]="misTarjetas" (canjear)="abrirRuleta($event)" (verRuleta)="abrirRuleta($event)" />
    }
</div>

<!-- Un solo modal para "Ver ruleta" y "Canjear": mi-ruleta decide si es interactiva o solo vista previa -->
<app-modal [(visible)]="showRuletaModal" titulo="Ruleta de fidelización" mode="ver" icono="pi-star" maxWidth="36rem" (cerrado)="alCerrarRuleta()">
    @if (tarjetaRuletaSeleccionada) {
    <app-mi-ruleta [tarjeta]="tarjetaRuletaSeleccionada" [activa]="showRuletaModal" />
    }
</app-modal>
