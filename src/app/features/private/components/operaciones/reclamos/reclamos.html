<div class="flex flex-col gap-6 mt-5">
  <app-page-header titulo="Reclamos" [icono]="icono" subtitulo="Registra, da seguimiento y resuelve los reclamos de clientes">
    <app-search-bar placeholder="Buscar por N° reclamo" ancho="w-full md:w-[24rem] lg:w-[32rem] xl:w-[40rem]"
      (search)="buscarReclamos($event)" />
    <app-button variant="primary" size="sm" icon="plus" label="Crear reclamo" (clicked)="abrirCrear()" />
  </app-page-header>

  @if (statsCards.length) {
    <app-stats [items]="statsCards" />
  }

  <app-filtros [fields]="filtrosReclamo" [titulo]="texto" [text]="texto" [acordeon]="true" [abierto]="false"
    (buscar)="onBuscar($event)" (limpiar)="onLimpiar()" />

  <app-reclamo-table [reclamos]="reclamos" [cargado]="cargado" [hayFiltros]="hayFiltros"
    [first]="first" [rows]="rows" [totalRecords]="totalRecords" (pageChange)="onPageChange($event)"
    (actualizar)="abrirActualizar($event)" (eliminar)="eliminarReclamo($event)" (ver)="abrirVer($event)"
    (limpiar)="onLimpiar()" />
</div>

<app-modal [(visible)]="mostrarFormulario" titulo="Crear reclamo" mode="crear" icono="pi-exclamation-circle"
  maxWidth="80rem" (cerrado)="cerrarFormulario()">
  <app-reclamo-form [guardando]="guardando" [resetTrigger]="resetFormTrigger"
    (guardar)="guardarReclamo($event)" (cancelarEvento)="cerrarFormulario()" />
</app-modal>

<app-modal [(visible)]="mostrarFormularioActualizar" titulo="Actualizar reclamo" mode="editar"
  icono="pi-exclamation-circle" maxWidth="50rem" (cerrado)="cerrarActualizar()">
  <app-reclamo-actualizar [reclamo]="reclamoSeleccionado" [guardando]="guardando"
    (guardar)="guardarActualizacion($event)" (cancelarEvento)="cerrarActualizar()" />
</app-modal>
