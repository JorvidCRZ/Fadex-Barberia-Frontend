<div class="flex flex-col gap-6 mt-5">
  <app-page-header titulo="Gestión de Ventas" icono="shopping-cart" subtitulo="Consulta y administra las ventas registradas">
    <app-search-bar placeholder="Buscar venta por cliente..." (search)="buscarPorTexto($event)" />
    <app-button variant="primary" size="sm" icon="plus" label="Crear Venta" (clicked)="abrirCrearVenta()" />
  </app-page-header>
  <app-stats [items]="stats" />

  <app-filtros [fields]="filtrosFields" titulo="Filtros Avanzados" text="Filtros" [acordeon]="true"
    (buscar)="buscarVentas($event)" (limpiar)="limpiarFiltros()" />

  <app-venta-table [ventas]="ventas" [cargado]="cargado" [totalRecords]="totalRecords" [rows]="rows" [first]="first"
    [esAdmin]="!esBarbero" (paginar)="onPaginator($event)" (eliminar)="eliminarVenta($event)"
    (descargarComprobante)="descargarComprobante($event)" />
</div>

<app-modal [(visible)]="mostrarFormulario" [titulo]="ventaSeleccionada ? 'Editar Venta' : 'Crear Venta'"
  [mode]="ventaSeleccionada ? 'editar' : 'crear'" icono="pi-shopping-cart" maxWidth="70rem">
  <app-venta-form [venta]="ventaSeleccionada" [isEditMode]="!!ventaSeleccionada" (guardar)="guardarVenta($event)"
    (cancelarEvento)="cerrarFormulario()" />
</app-modal>
