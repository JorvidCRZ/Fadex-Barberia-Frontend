<div class="ventas-stats">

    <div class="venta-stat-card venta-stat-card--gold">
        <div class="venta-stat-card__icon">
            <i class="pi pi-file"></i>
        </div>
        <div class="venta-stat-card__label">Total ventas</div>
        <div class="venta-stat-card__value">{{ totalVentas }}</div>
        <div class="venta-stat-card__description venta-stat-card__description--up">
            <i class="pi pi-arrow-up-right"></i> +18 este mes
        </div>
    </div>

    <div class="venta-stat-card venta-stat-card--green">
        <div class="venta-stat-card__icon">
            <i class="pi pi-dollar"></i>
        </div>
        <div class="venta-stat-card__label">Ingresos totales</div>
        <div class="venta-stat-card__value">S/ {{ ingresos | number:(ingresos % 1 === 0 ? '1.0-0' : '1.2-2') }}</div>
        <div class="venta-stat-card__description venta-stat-card__description--up">
            <i class="pi pi-arrow-up-right"></i> +9.8% este mes
        </div>
    </div>

    <div class="venta-stat-card venta-stat-card--blue">
        <div class="venta-stat-card__icon">
            <i class="pi pi-chart-line"></i>
        </div>
        <div class="venta-stat-card__label">Promedio por venta</div>
        <div class="venta-stat-card__value">S/ {{ promedio | number:'1.2-2' }}</div>
        <div class="venta-stat-card__description venta-stat-card__description--up">
            <i class="pi pi-arrow-up-right"></i> +2.4% este mes
        </div>
    </div>

</div>
