<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-[#121212] border border-[#C9A84C]/25 rounded-xl p-5">
        <div class="flex items-start justify-between">
            <span class="text-[11px] text-gray-400 tracking-wider uppercase">Total ventas</span>
            <i class="pi pi-file text-[#C9A84C] text-sm"></i>
        </div>
        <span class="block text-3xl font-bold text-white mt-3">{{ totalVentas }}</span>
        <span class="flex items-center gap-1 text-xs text-green-500 mt-2">
            <i class="pi pi-arrow-up-right text-[10px]"></i> +18 este mes
        </span>
    </div>

    <div class="bg-[#121212] border border-[#C9A84C]/25 rounded-xl p-5">
        <div class="flex items-start justify-between">
            <span class="text-[11px] text-gray-400 tracking-wider uppercase">Ingresos totales</span>
            <i class="pi pi-dollar text-[#C9A84C] text-sm"></i>
        </div>
        <span class="block text-3xl font-bold text-white mt-3">S/ {{ ingresos | number:(ingresos % 1 === 0 ? '1.0-0' : '1.2-2') }}</span>
        <span class="flex items-center gap-1 text-xs text-green-500 mt-2">
            <i class="pi pi-arrow-up-right text-[10px]"></i> +9.8% este mes
        </span>
    </div>

    <div class="bg-[#121212] border border-[#C9A84C]/25 rounded-xl p-5">
        <div class="flex items-start justify-between">
            <span class="text-[11px] text-gray-400 tracking-wider uppercase">Promedio por venta</span>
            <i class="pi pi-chart-line text-[#C9A84C] text-sm"></i>
        </div>
        <span class="block text-3xl font-bold text-white mt-3">S/ {{ promedio | number:'1.2-2' }}</span>
        <span class="flex items-center gap-1 text-xs text-green-500 mt-2">
            <i class="pi pi-arrow-up-right text-[10px]"></i> +2.4% este mes
        </span>
    </div>
</div>
