<div class="flex flex-col gap-6 mt-5">
  <app-page-header titulo="Servicios" [icono]="icono" subtitulo="Gestiona los servicios, precios, duración y publicación">
    <app-search-bar placeholder="Buscar servicio" ancho="w-full md:w-[24rem] lg:w-[32rem] xl:w-[40rem]" (search)="buscarServicios($event)" />
    <app-button variant="primary" size="sm" icon="plus" label="Crear servicio" (clicked)="abrirCrear()" />
  </app-page-header>

  @if (stats.length) {
    <app-stats [items]="stats" />
  }

  <app-filtros [fields]="filtrosFields" [titulo]="texto" [text]="texto" [acordeon]="true" [abierto]="false"
    (buscar)="onBuscar($event)" (limpiar)="onLimpiar()" />

  <app-servicio-table [servicios]="servicios" [cargado]="cargado" [hayFiltros]="hayFiltros"
    [first]="first" [rows]="rows" [totalRecords]="totalRecords" (pageChange)="onPageChange($event)"
    (editar)="abrirEditar($event)" (estado)="onCambiarEstado($event)" (publicado)="onCambiarPublicado($event)"
    (eliminar)="eliminarServicio($event)" (limpiar)="onLimpiar()" />
</div>

<app-modal [(visible)]="mostrarFormulario" [titulo]="servicioSeleccionado ? 'Editar Servicio' : 'Crear Servicio'"
  [mode]="servicioSeleccionado ? 'editar' : 'crear'" [icono]="icono" maxWidth="80rem" (cerrado)="cerrarFormulario()">
  <app-servicio-form [servicio]="servicioSeleccionado" [categorias]="categorias" [guardando]="guardando"
    [resetTrigger]="resetFormTrigger" (guardar)="guardarServicio($event)" (cancelarEvento)="cerrarFormulario()" />
</app-modal>
