<div class="flex flex-col gap-6 mt-5">
  <app-page-header titulo="Productos" [icono]="icono" subtitulo="Administra el catálogo, precios, stock y publicación">
    <app-search-bar placeholder="Buscar producto" ancho="w-full md:w-[24rem] lg:w-[32rem] xl:w-[40rem]" (search)="buscarProductos($event)" />
    <app-button variant="primary" size="sm" icon="plus" label="Crear producto" (clicked)="abrirCrear()" />
  </app-page-header>

  @if (stats.length) {
    <app-stats [items]="stats" />
  }

  <app-filtros [fields]="filtrosFields" [titulo]="texto" [text]="texto" [acordeon]="true" [abierto]="false"
    (buscar)="onBuscar($event)" (limpiar)="onLimpiar()" />

  <app-producto-table [productos]="productos" [cargado]="cargado" [hayFiltros]="hayFiltros"
    [first]="first" [rows]="rows" [totalRecords]="totalRecords" (pageChange)="onPageChange($event)"
    (editar)="abrirEditar($event)" (ver)="abrirVer($event)" (estado)="onCambiarEstado($event)"
    (publicado)="onCambiarPublicado($event)" (eliminar)="eliminarProducto($event)" (limpiar)="onLimpiar()" />
</div>

<app-modal [(visible)]="mostrarFormulario" [titulo]="productoSeleccionado ? 'Editar Producto' : 'Crear Producto'"
  [mode]="productoSeleccionado ? 'editar' : 'crear'" [icono]="icono" maxWidth="80rem" (cerrado)="cerrarFormulario()">
  <app-producto-form [producto]="productoSeleccionado" [categorias]="categorias" [guardando]="guardando"
    [resetTrigger]="resetFormTrigger" (guardar)="guardarProducto($event)" (cancelarEvento)="cerrarFormulario()" />
</app-modal>

<app-modal [(visible)]="mostrarDetalle" titulo="Detalle del producto" mode="ver"
  [icono]="icono" maxWidth="64rem" (cerrado)="cerrarDetalle()">
  @if (productoDetalle) {
    <app-producto-detalle [producto]="productoDetalle" />
  }
</app-modal>
