<div class="flex flex-col gap-6 mt-5">
  <app-page-header titulo="Categorías" [icono]="icono" subtitulo="Organiza el catálogo en categorías y subcategorías">
   <app-search-bar placeholder="Buscar categoría" ancho="w-full md:w-[24rem] lg:w-[32rem] xl:w-[40rem]" (search)="buscarCategorias($event)" />
    <app-button variant="primary" size="sm" icon="plus" label="Crear categoría" (clicked)="abrirCrear()" />
  </app-page-header>

  @if (stats.length) {
    <app-stats [items]="stats" />
  }

  <app-filtros [fields]="filtrosFields" [titulo]="texto" [text]="texto" [acordeon]="true" [abierto]="false"
    (buscar)="onBuscar($event)" (limpiar)="onLimpiar()" />

  <app-categoria-table [categorias]="categorias" [cargado]="cargado" [hayFiltros]="hayFiltros"
    [first]="first" [rows]="rows" [totalRecords]="totalRecords" (pageChange)="onPageChange($event)"
    (editar)="abrirEditar($event)" (estado)="onCambiarEstado($event)" (eliminar)="eliminarCategoria($event)"
    (limpiar)="onLimpiar()" />
</div>

<app-modal [(visible)]="mostrarFormulario" [titulo]="categoriaSeleccionada ? 'Editar Categoría' : 'Crear Categoría'"
  [mode]="categoriaSeleccionada ? 'editar' : 'crear'" [icono]="icono" maxWidth="32rem" (cerrado)="cerrarFormulario()">
  <app-categoria-form [categoria]="categoriaSeleccionada" [categoriasPadres]="categorias" [guardando]="guardando"
    (guardar)="guardarCategoria($event)" (cancelarEvento)="cerrarFormulario()" />
</app-modal>
