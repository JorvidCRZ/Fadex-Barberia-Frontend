<ul class="space-y-4 md:space-y-6 table-base">
    @for (categoria of categorias; track categoria.id) {
    <li class="relative mb-1 md:mb-2 ml-2 md:ml-8">
        <div class="flex min-h-[56px] w-full items-center justify-start rounded-md p-3 transition md:min-h-[64px] md:p-4">
            <div class="flex w-full flex-wrap items-center gap-4 md:gap-6">
                @if ((categoria.subcategorias?.length ?? 0) > 0) {
                    <app-button variant="expandir-tabla" [icon]="isExpanded(categoria) ? 'chevron-down' : 'chevron-right'"
                        [tooltip]="isExpanded(categoria) ? 'Ocultar subcategorías' : 'Ver subcategorías'"
                        (clicked)="toggleExpand(categoria)" />
                } @else {
                    <span class="inline-block size-10" aria-hidden="true"></span>
                }
                <span class="font-semibold">{{ categoria.nombre }}</span>
                <span class="texto ml-2 text-sm md:ml-6">{{ categoria.descripcion }}</span>
                <app-status-badge type="text" [value]="categoria.tipo" class="ml-4 md:ml-6" />
                <div class="ml-auto flex items-center justify-center gap-2 md:ml-8 md:gap-4">
                    <app-status-badge type="boolean" [value]="categoria.estado" trueLabel="Activo" falseLabel="Inactivo" />
                    <p-toggleSwitch [ngModel]="categoria.estado" (onChange)="cambiarEstado(categoria, $event)" class="scale-90" />
                </div>
                <div class="ml-4 flex items-center gap-2 md:ml-6">
                    <app-button variant="editar-tabla" icon="pencil" tooltip="Editar categoría"
                        (clicked)="actualizarCategoria(categoria)" />
                    <app-button variant="eliminar-tabla" icon="trash" tooltip="Eliminar categoría"
                        (clicked)="eliminarCategoria(categoria)" />
                </div>
            </div>
        </div>
        @if ((categoria.subcategorias?.length ?? 0) > 0 && isExpanded(categoria)) {
        <div class="ml-6 mt-2 border-l border-ui-border pl-3 md:ml-10 md:mt-3 md:pl-6">
            <app-categoria-tree [categorias]="categoria.subcategorias ?? []" (editar)="actualizarCategoria($event)"
                (eliminar)="eliminarCategoria($event)" (estado)="estado.emit($event)" />
        </div>
        }
    </li>
    }
</ul>
