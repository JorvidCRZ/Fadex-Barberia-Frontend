<div class="flex flex-col gap-2">
    <div class="table-base p-4 md:p-6 lg:p-8">
        <div class="relative w-full overflow-x-auto">
            <p-table [value]="categorias" [loading]="!cargado" dataKey="id" expandableRows
                [tableStyle]="{ 'min-width': '1000px' }" class="rounded-xl">

                <ng-template #header>
                    <tr class="table-header">
                        <th class="text-center">Nombre</th>
                        <th class="text-center">Descripción</th>
                        <th class="text-center">Tipo</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </ng-template>

                <ng-template #body let-categoria let-expanded="expanded">
                    <tr class="table-row">
                        <td class="px-4 py-2 whitespace-nowrap">
                            <div class="inline-flex items-center gap-2">
                                @if ((categoria.subcategorias ?? []).length > 0) {
                                    <app-button variant="expandir-tabla" [pRowToggler]="categoria"
                                        [icon]="expanded ? 'chevron-down' : 'chevron-right'"
                                        [tooltip]="expanded ? 'Ocultar subcategorías' : 'Ver subcategorías'" />
                                } @else {
                                    <span class="inline-block size-10" aria-hidden="true"></span>
                                }
                                <span class="font-medium transition-colors duration-200">{{ categoria.nombre }}</span>
                            </div>
                        </td>
                        <td class="texto whitespace-nowrap text-center">
                            <span class="block max-w-xs truncate mx-auto cursor-help" [pTooltip]="categoria.descripcion"
                                tooltipPosition="top">{{ categoria.descripcion }}</span>
                        </td>
                        <td class="whitespace-nowrap text-center">
                            <app-status-badge type="text" [value]="categoria.tipo" />
                        </td>
                        <td class="whitespace-nowrap text-center">
                            <div class="flex items-center justify-center gap-2">
                                <app-status-badge type="boolean" [value]="categoria.estado" trueLabel="Activo" falseLabel="Inactivo" />
                                <p-toggleSwitch [ngModel]="categoria.estado" (onChange)="cambiarEstado(categoria, $event)" class="scale-90" />
                            </div>
                        </td>
                        <td class="whitespace-nowrap text-center">
                            <div class="table-actions">
                                <app-button variant="editar-tabla" icon="pencil" tooltip="Editar categoría"
                                    (clicked)="actualizarCategoria(categoria)" />
                                <app-button variant="eliminar-tabla" icon="trash" tooltip="Eliminar categoría"
                                    (clicked)="pedirConfirmacion(categoria, $event)" />
                            </div>
                        </td>
                    </tr>
                </ng-template>

                <ng-template #expandedrow let-categoria>
                    @if ((categoria.subcategorias ?? []).length > 0) {
                        <tr>
                            <td colspan="5" class="p-0">
                                <div class="rounded-xl bg-ui-surface p-4 shadow-sm">
                                    <h3 class="mb-4 text-md font-semibold text-text-primary">Subcategorías de {{ categoria.nombre }}</h3>
                                    <div class="ml-4 md:ml-6 mt-1 space-y-1 border-l border-ui-border pl-4">
                                        <app-categoria-tree [categorias]="categoria.subcategorias ?? []"
                                            (editar)="actualizarCategoria($event)" (eliminar)="eliminarDesdeTree($event)"
                                            (estado)="handleTreeEstado($event)" />
                                    </div>
                                </div>
                            </td>
                        </tr>
                    }
                </ng-template>

                <ng-template #emptymessage>
                    <tr>
                        <td colspan="5">
                            <app-empty-state icono="tags"
                                [mensaje]="hayFiltros ? 'No se encontraron categorías con los filtros aplicados' : 'Aún no hay categorías registradas'"
                                [detalle]="hayFiltros ? undefined : 'Crea la primera con el botón «Crear categoría».'">
                                @if (hayFiltros) {
                                    <app-button variant="limpiar" size="sm" label="Limpiar filtros" (clicked)="limpiar.emit()" />
                                }
                            </app-empty-state>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <app-paginator [first]="first" [rows]="rows" [totalRecords]="totalRecords" etiqueta="categoría(s)"
        [rowsPerPageOptions]="[10, 25, 50, 100]" (pageChange)="pageChange.emit($event)" />
</div>

<app-confirm-popover [visible]="mostrarConfirmacion" mode="eliminar" titulo="Eliminar categoría"
    [mensaje]="mensajeConfirmacion" (confirm)="confirmarEliminar()" (cancel)="cancelarEliminar()" />
