<aside class="flex flex-col gap-4 px-0 py-0 bg-transparent">
  <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
    <div>
      <h1 class="text-xl font-semibold text-brand-white">{{ title }}</h1>
      <p class="mt-1 text-sm text-text-muted">{{ description }}</p>
    </div>
  <a pButton [label]="buttonLabel + ' barbero'" icon="pi pi-plus" class="p-button-sm boton-primary"
    routerLink="/dashboard/admin/gestion/barberos/registrar-barbero"></a>
  </div>
  <app-search-bar placeholder="Buscar barbero..." (search)="onSearch($event)"></app-search-bar>
</aside>
