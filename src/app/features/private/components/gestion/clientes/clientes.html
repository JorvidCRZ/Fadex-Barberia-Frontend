<div class="mt-5">
	<app-header-client [title]="'Clientes'" [icon]="icono" [description]="'Gestión y administración de clientes'" [buttonLabel]="'Nuevo'" [searchValue]="searchTerm" (create)="abrirCrear()" (search)="onSearch($event)"/>
</div>

<div class="mt-5">
	<app-resumen-general-client/>
</div>

<app-filtros
	class="block mt-5"
	[fields]="filtroFields"
	titulo="Clientes"
	text="Clientes"
	icono="pi pi-users"
	[acordeon]="true"
	[abierto]="false"
	(buscar)="onBuscarFiltros($event)"
	(limpiar)="onLimpiarFiltros()"
/>

<section class="mt-1 section-shell section-shell--main">
	<div class="section-header">
		<div>
			<div class="section-badge">
				<span>Gestion de clientes</span>
			</div>
		</div>
		<div class="section-mark">✦</div>
	</div>

	<div class="section-content">
		<app-table-client [clients]="visibleClients" [totalElements]="totalElements" [currentPage]="currentPage" [totalPages]="totalPages" [rows]="pageSize" [activeFilter]="activeFilter" [isSearchMode]="isSearchActive" (pageChange)="onPageChange($event)" (delete)="onDisableCliente($event)" (reactivate)="onReactivateCliente($event)"/>
	</div>
</section>
