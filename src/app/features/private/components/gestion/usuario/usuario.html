<div class="flex flex-col gap-6 mt-5">
  <app-page-header titulo="Usuarios" icono="users" subtitulo="Gestión y administración de usuarios">
    <app-search-bar placeholder="Buscar usuario..." (search)="onSearch($event)" />
    <app-button variant="primary" size="sm" icon="user-plus" label="Añadir administrador" (clicked)="abrirRegistro()" />
  </app-page-header>

  @if (stats.length) {
    <app-stats [items]="stats" />
  }

  <app-filtros [fields]="filtroFields" titulo="Usuarios" text="Usuarios" icono="pi pi-users" [acordeon]="true"
    [abierto]="false" (buscar)="onBuscarFiltros($event)" (limpiar)="onLimpiar()" />

  @if (errorCarga) {
    <app-empty-state tipo="error" [mensaje]="errorCarga" [boxed]="true">
      <app-button variant="secondary" size="sm" icon="refresh" label="Reintentar" (clicked)="cargarUsuarios(currentPage)" />
    </app-empty-state>
  } @else {
    <div class="flex flex-col gap-2">
      <div class="table-base p-4 md:p-6 lg:p-8">
        <div class="relative w-full overflow-x-auto">
          <p-table [value]="usuarios" [loading]="cargando" dataKey="usuarioId" [tableStyle]="{ 'min-width': '900px' }"
            class="rounded-xl">

            <ng-template #header>
              <tr class="table-header">
                <th class="text-left">Usuario</th>
                <th class="text-left">Nombre</th>
                <th class="text-left">Roles</th>
                <th class="text-center">QR</th>
                <th class="text-center">PIN</th>
                <th class="text-center">Acciones</th>
              </tr>
            </ng-template>

            <ng-template #body let-u>
              <tr class="table-row">
                <td>
                  <div class="flex items-center gap-3">
                    <div class="flex size-10 items-center justify-center rounded-full border border-brand-gold/20 bg-brand-gold/10 font-bold text-brand-gold">
                      {{ iniciales(u.username) }}
                    </div>
                    <span class="truncate font-semibold leading-tight text-text-primary">{{ u.username || '—' }}</span>
                  </div>
                </td>

                <td>
                  <div class="font-semibold leading-tight text-text-primary">{{ u.nombre || '—' }}</div>
                  <div class="text-xs leading-tight text-text-muted">{{ u.apellido }}</div>
                </td>

                <td>
                  <div class="flex flex-wrap gap-1">
                    @for (rol of u.roles; track rol) {
                      <app-status-badge type="text" [value]="rol" [customClass]="claseRol(rol)" />
                    } @empty {
                      <span class="text-xs text-text-muted">—</span>
                    }
                  </div>
                </td>

                <td class="text-center">
                  <span class="inline-flex size-10 items-center justify-center rounded-xl border"
                    [class]="u.tieneQr ? 'border-success/30 bg-success/10 text-success' : 'border-ui-border bg-ui-card text-text-subtle'"
                    [pTooltip]="u.tieneQr ? 'QR disponible' : 'Sin QR'" tooltipPosition="top">
                    <i class="pi pi-qrcode text-sm"></i>
                  </span>
                </td>
 
                <td class="text-center">
                  <span class="inline-flex size-10 items-center justify-center rounded-xl border"
                    [class]="u.tienePin ? 'border-info/30 bg-info/10 text-info' : 'border-ui-border bg-ui-card text-text-subtle'"
                    [pTooltip]="u.tienePin ? 'Tiene PIN' : 'Sin PIN'" tooltipPosition="top">
                    <i class="pi pi-lock text-sm"></i>
                  </span>
                </td>

                <td class="text-center">
                  <div class="table-actions">
                    <app-button variant="ver-tabla" icon="eye" tooltip="Ver detalle" (clicked)="abrirVer(u)" />
                    <app-button variant="editar-tabla" icon="pencil" tooltip="Editar usuario" (clicked)="abrirEditar(u)" />
                  </div>
                </td>
              </tr>
            </ng-template>

            <ng-template #emptymessage>
              <tr>
                <td colspan="6">
                  <app-empty-state icono="users"
                    [mensaje]="hayFiltros ? 'No se encontraron usuarios con los filtros aplicados' : 'Aún no hay usuarios registrados'">
                    @if (hayFiltros) {
                      <app-button variant="limpiar" size="sm" label="Limpiar filtros" (clicked)="onLimpiar()" />
                    }
                  </app-empty-state>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>

      <app-paginator [first]="first" [rows]="rows" [totalRecords]="totalElements" etiqueta="usuario(s)"
        [rowsPerPageOptions]="[10, 25, 50]" (pageChange)="onPageChange($event)" />
    </div>
  }
</div>

<app-usuario-registrar [(visible)]="registroVisible" (creado)="onUsuarioCreado()" />

<app-usuario-detalle [(visible)]="verVisible" [usuarioId]="usuarioId" [refresco]="refrescoVer"
  (editar)="editarVisible = true" (pin)="pinVisible = true" (qr)="abrirQr($event)" />

<app-usuario-editar [(visible)]="editarVisible" [usuarioId]="usuarioId" (guardado)="onUsuarioActualizado()" />

<app-usuario-pin [(visible)]="pinVisible" [usuarioId]="usuarioId" (asignado)="onUsuarioActualizado()" />

<app-usuario-qr [(visible)]="qrVisible" [usuarioId]="usuarioId" [regenerar]="qrRegenerar" [qrActual]="qrActual"
  (generado)="onUsuarioActualizado()" />
