  <header class="fixed left-0 top-0 z-50 w-full border-b border-ui-border bg-ui-black/95 px-2 backdrop-blur-xl sm:px-4 lg:px-6 xl:px-8">
    <input id="public-menu-toggle" class="public-menu-checkbox" type="checkbox" aria-label="Abrir menú de navegación" />
    <div class="container-main flex w-full flex-wrap items-center justify-between gap-4 py-1 lg:h-[4.9375rem] lg:flex-nowrap lg:py-0">
      <a routerLink="/inicio" class="group inline-flex items-center gap-3 rounded-2xl p-3 transition-all duration-300 ease-out hover:bg-brand-gold-soft hover:shadow-[0_0_20px_rgba(212,175,55,0.15)]">
        <div class="transition-all duration-300 ease-out group-hover:scale-110 group-hover:rotate-3">
          <app-logo variant="icon" size="sm" />
        </div>
        <span class="text-[1.7rem] font-bold leading-none tracking-[0.18em] transition-all duration-300 ease-out group-hover:translate-x-1 group-hover:text-brand-gold">FadeX</span>
      </a>

      <label class="public-menu-button lg:hidden" for="public-menu-toggle" aria-hidden="true">
        <span></span><span></span><span></span>
      </label>

      <nav class="hidden w-full items-center justify-center gap-6 lg:flex lg:w-auto xl:gap-11" aria-label="Navegación principal">
        @for (p of publicNav; track p.path) {
          <a [routerLink]="p.path" routerLinkActive="!text-white" class="group relative pb-1 text-sm font-medium text-brand-white transition-colors hover:text-brand-gold sm:text-base"> {{ p.label }}
            <span class="absolute bottom-0 left-1/2 h-0.5 w-0 rounded bg-brand-gold transition-all duration-300 group-hover:left-0 group-hover:w-full"></span>
          </a>
        }
      </nav>
      <div class="hidden w-full items-center justify-end gap-5 lg:flex lg:w-auto">
        <a routerLink="/carrito" aria-label="Carrito de compras" class="relative flex h-9 w-9 items-center justify-center rounded-lg text-brand-white transition-all hover:bg-ui-surface hover:text-brand-gold">
          <i class="pi pi-shopping-cart text-lg" aria-hidden="true"></i>
          <span class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-brand-gold text-xs font-bold text-black">{{ cartItemCount() }}</span>
        </a>

        @if (isAuthenticated()) {
          <div class="flex items-center gap-4 border-r border-ui-border pr-5">
            <a routerLink="/reclamos" aria-label="Reclamos" class="flex h-9 w-9 items-center justify-center rounded-lg text-brand-white transition-all hover:bg-ui-surface hover:text-brand-gold">
              <i class="pi pi-book text-lg" aria-hidden="true"></i>
            </a>
          </div>

          <a [routerLink]="profileLink()" aria-label="Perfil" class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-gold text-black transition-all hover:scale-110 hover:bg-brand-gold-hover">
            <i class="pi pi-user text-lg" aria-hidden="true"></i>
          </a>

          <button type="button" (click)="logout()" aria-label="Cerrar sesión" class="flex flex-col items-center justify-center gap-1 rounded-lg p-2 text-xs text-brand-white transition hover:bg-ui-elevated hover:text-brand-red">
            <i class="pi pi-sign-out  text-sm" aria-hidden="true"></i> 
          </button>

          } @else {
            <a routerLink="/login" class="rounded-full bg-brand-gold px-7 py-3 text-sm font-bold uppercase tracking-wide text-black transition-colors hover:bg-brand-gold-hover xl:px-9 xl:py-3.5"> Login </a>
          }
      </div>
    </div>

      <div class="public-menu">
        <nav aria-label="Menú móvil">
          @for (p of publicNav; track p.path) {
            <a [routerLink]="p.path" class="text-sm font-medium text-brand-white transition hover:bg-brand-gold/10 hover:text-brand-gold"> {{ p.label }} </a>
          }
        </nav>

        <div class="public-menu-actions">
          <a routerLink="/carrito" aria-label="Carrito" class="relative gap-2 text-sm text-brand-white transition hover:bg-ui-elevated hover:text-brand-gold">
            <i class="pi pi-shopping-cart" aria-hidden="true"></i>
            <span>Carrito ({{ cartItemCount() }})</span>
          </a>

          @if (isAuthenticated()) {
            <a routerLink="/reclamos" aria-label="Reclamos" class="gap-2 text-sm text-brand-white transition hover:bg-ui-elevated hover:text-brand-gold">
              <i class="pi pi-book" aria-hidden="true"></i>
              <span>Reclamos</span>
            </a>

            <a [routerLink]="profileLink()" aria-label="Perfil" class="gap-2 bg-brand-gold text-sm text-black transition-all hover:bg-brand-gold-hover">
              <i class="pi pi-user" aria-hidden="true"></i>
              <span>Perfil</span>
            </a>

            <button type="button" (click)="logout()" class="gap-2 text-sm text-brand-white transition hover:bg-ui-elevated hover:text-brand-gold">
              <i class="pi pi-sign-out" aria-hidden="true"></i>
              <span>Cerrar sesión</span>
            </button>
          } @else {
            <a routerLink="/login" class="bg-brand-gold text-sm font-bold uppercase tracking-wide text-black transition hover:bg-brand-gold-hover">Login</a>
          }
        </div>
      </div>
  </header>
