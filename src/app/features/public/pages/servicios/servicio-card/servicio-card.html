<div role="button" tabindex="0" (click)="onSeleccionar()" (keydown.enter)="onSeleccionar()" [attr.aria-label]="'Ver ' + servicio.nombre"
class="relative bg-brand-black border border-ui-border-white/60 hover:border-brand-gold rounded-xl overflow-hidden transition-all duration-300 hover:shadow-lg hover:shadow-brand-gold/10 group flex flex-col cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-brand-gold">

    <div class="relative w-full aspect-[4/3] bg-brand-white/5 overflow-hidden">
        <img [alt]="servicio.nombre" [src]="getImagen() | safeImageUrl" (error)="onImgError($event)"
             class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-110 transition duration-300" />
        <span class="absolute top-2 left-2 bg-black *:bg-opacity-50 text-brand-white text-xs font-semibold p-0 m-0 rounded-xl">
            <app-status-badge type="text" [value]="servicio.categoriaNombre" customClass="estado-servicio" />
        </span>
    </div>

    <div class="p-4 flex flex-col flex-1 gap-3">
        <h3 class="text-brand-white text-base font-semibold leading-snug line-clamp-2 min-h-[2.75rem]">{{ servicio.nombre }}</h3>

        <div class="flex items-center justify-between pt-3 border-t border-ui-border-soft">
            <span class="text-brand-gold font-bold text-lg">{{ servicio.precio | soles }}</span>
            <span class="text-text-secondary text-xs flex items-center gap-1">
                <i class="pi pi-clock text-[11px]" aria-hidden="true"></i>{{ servicio.duracion }} min
            </span>
        </div>

        <span class="text-brand-gold text-sm font-medium group-hover:underline">Ver detalle →</span>
    </div>
</div>
